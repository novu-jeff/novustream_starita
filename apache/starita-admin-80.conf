# admin.staritawaterdistrictpamp.gov.ph — staff + offline API (sta-rita)

<VirtualHost *:80>
    ServerName admin.staritawaterdistrictpamp.gov.ph
    DocumentRoot /var/www/html/sta-rita/public

    <Directory /var/www/html/sta-rita/public>
        AllowOverride All
        Require all granted
    </Directory>

    <FilesMatch \.php$>
        SetHandler "proxy:unix:/run/php/php8.3-fpm.sock|fcgi://localhost/"
    </FilesMatch>

    ErrorLog ${APACHE_LOG_DIR}/starita_admin_error.log
    CustomLog ${APACHE_LOG_DIR}/starita_admin_access.log combined

    RewriteEngine on
    RewriteCond %{REQUEST_URI} !^/\.well-known/acme-challenge/
    RewriteCond %{SERVER_NAME} =admin.staritawaterdistrictpamp.gov.ph
    RewriteRule ^ https://%{SERVER_NAME}%{REQUEST_URI} [END,NE,R=permanent]
</VirtualHost>
