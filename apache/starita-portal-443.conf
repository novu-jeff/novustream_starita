# portal HTTPS — concessionaire (sta-rita)
# SSL lines may be rewritten by certbot.

<IfModule mod_ssl.c>
<VirtualHost *:443>
    ServerName portal.staritawaterdistrictpamp.gov.ph
    DocumentRoot /var/www/html/sta-rita/public

    <Directory /var/www/html/sta-rita/public>
        AllowOverride All
        Require all granted
    </Directory>

    <FilesMatch \.php$>
        SetHandler "proxy:unix:/run/php/php8.3-fpm.sock|fcgi://localhost/"
    </FilesMatch>

    ErrorLog ${APACHE_LOG_DIR}/starita_portal_ssl_error.log
    CustomLog ${APACHE_LOG_DIR}/starita_portal_ssl_access.log combined

    Include /etc/letsencrypt/options-ssl-apache.conf
    SSLCertificateFile /etc/letsencrypt/live/staritawaterdistrictpamp.gov.ph/fullchain.pem
    SSLCertificateKeyFile /etc/letsencrypt/live/staritawaterdistrictpamp.gov.ph/privkey.pem
</VirtualHost>
</IfModule>
