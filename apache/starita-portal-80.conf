# portal.staritawaterdistrictpamp.gov.ph — concessionaire (sta-rita)

<VirtualHost *:80>
    ServerName portal.staritawaterdistrictpamp.gov.ph
    DocumentRoot /var/www/html/sta-rita/public

    <Directory /var/www/html/sta-rita/public>
        AllowOverride All
        Require all granted
    </Directory>

    <FilesMatch \.php$>
        SetHandler "proxy:unix:/run/php/php8.3-fpm.sock|fcgi://localhost/"
    </FilesMatch>

    ErrorLog ${APACHE_LOG_DIR}/starita_portal_error.log
    CustomLog ${APACHE_LOG_DIR}/starita_portal_access.log combined

    RewriteEngine on
    RewriteCond %{REQUEST_URI} !^/\.well-known/acme-challenge/
    RewriteCond %{SERVER_NAME} =portal.staritawaterdistrictpamp.gov.ph
    RewriteRule ^ https://%{SERVER_NAME}%{REQUEST_URI} [END,NE,R=permanent]
</VirtualHost>
