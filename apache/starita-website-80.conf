# Apex HTTP → HTTPS (legacy path redirects live on :443)

<VirtualHost *:80>
    ServerName staritawaterdistrictpamp.gov.ph
    ServerAlias www.staritawaterdistrictpamp.gov.ph

    DocumentRoot /var/www/html/sta-rita_website/public

    <Directory /var/www/html/sta-rita_website/public>
        AllowOverride All
        Require all granted
    </Directory>

    <FilesMatch \.php$>
        SetHandler "proxy:unix:/run/php/php8.3-fpm.sock|fcgi://localhost/"
    </FilesMatch>

    ErrorLog ${APACHE_LOG_DIR}/starita_website_error.log
    CustomLog ${APACHE_LOG_DIR}/starita_website_access.log combined

    RewriteEngine on
    RewriteCond %{SERVER_NAME} =www.staritawaterdistrictpamp.gov.ph [OR]
    RewriteCond %{SERVER_NAME} =staritawaterdistrictpamp.gov.ph
    RewriteRule ^ https://%{SERVER_NAME}%{REQUEST_URI} [END,NE,R=permanent]
</VirtualHost>
