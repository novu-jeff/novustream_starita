# Apex HTTPS — public website (sta-rita_website)
# Cert paths filled/managed by certbot; keep existing LE files.

<IfModule mod_ssl.c>
<VirtualHost *:443>
    ServerName staritawaterdistrictpamp.gov.ph
    ServerAlias www.staritawaterdistrictpamp.gov.ph

    # Legacy novustream bookmarks → subdomains
    RedirectMatch permanent ^/login$ https://portal.staritawaterdistrictpamp.gov.ph/login
    RedirectMatch permanent ^/register$ https://portal.staritawaterdistrictpamp.gov.ph/register
    RedirectMatch permanent ^/concessionaire(/.*)?$ https://portal.staritawaterdistrictpamp.gov.ph/concessionaire$1
    RedirectMatch permanent ^/payments(/.*)?$ https://portal.staritawaterdistrictpamp.gov.ph/payments$1
    RedirectMatch permanent ^/admin(/.*)?$ https://admin.staritawaterdistrictpamp.gov.ph/admin$1
    # Do NOT 301 /api → admin. Dart http does not re-POST after redirect, so offline
    # upload fails on field devices still pointed at the apex host. Serve /api from
    # the admin Laravel app so both hosts accept sync.

    RewriteEngine On
    RewriteRule ^/api(?:/.*)?$ /var/www/html/sta-rita/public/index.php [END]

    <Directory /var/www/html/sta-rita/public>
        Require all granted
        <FilesMatch \.php$>
            SetHandler "proxy:unix:/run/php/php8.3-fpm.sock|fcgi://localhost/"
        </FilesMatch>
    </Directory>

    DocumentRoot /var/www/html/sta-rita_website/public

    <Directory /var/www/html/sta-rita_website/public>
        AllowOverride All
        Require all granted
    </Directory>

    <FilesMatch \.php$>
        SetHandler "proxy:unix:/run/php/php8.3-fpm.sock|fcgi://localhost/"
    </FilesMatch>

    ErrorLog ${APACHE_LOG_DIR}/starita_website_ssl_error.log
    CustomLog ${APACHE_LOG_DIR}/starita_website_ssl_access.log combined

    Include /etc/letsencrypt/options-ssl-apache.conf
    SSLCertificateFile /etc/letsencrypt/live/staritawaterdistrictpamp.gov.ph/fullchain.pem
    SSLCertificateKeyFile /etc/letsencrypt/live/staritawaterdistrictpamp.gov.ph/privkey.pem
</VirtualHost>
</IfModule>
