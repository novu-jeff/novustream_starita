# Sta Rita NovuStream — https://novustream-starita.novulutions.com
# Install:
#   sudo cp /var/www/html/starita-staging/nginx-staging.conf /etc/nginx/sites-available/starita-staging
#   sudo ln -sf /etc/nginx/sites-available/starita-staging /etc/nginx/sites-enabled/starita-staging
#   sudo nginx -t && sudo systemctl reload nginx
#
# Public http://38.226.41.3:8002 redirects to the subdomain.
# 127.0.0.1:8002 still serves this app so local NovuPay webhooks keep working.

server {
    listen 8002 default_server;
    listen [::]:8002 default_server;
    server_name 38.226.41.3;

    return 301 https://novustream-starita.novulutions.com$request_uri;
}

server {
    listen 8002;
    listen [::]:8002;
    server_name 127.0.0.1 localhost ::1;

    root /var/www/html/starita-staging/public;
    index index.php index.html;

    client_max_body_size 50M;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        include snippets/fastcgi-php.conf;
        fastcgi_pass unix:/run/php/php8.5-fpm.sock;
        fastcgi_connect_timeout 60s;
        fastcgi_send_timeout 300s;
        fastcgi_read_timeout 300s;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        include fastcgi_params;
    }

    location ~ /\.ht {
        deny all;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name novustream-starita.novulutions.com;

    root /var/www/html/starita-staging/public;
    index index.php index.html;

    client_max_body_size 50M;

    ssl_certificate /etc/letsencrypt/live/novustream-starita.novulutions.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/novustream-starita.novulutions.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        include snippets/fastcgi-php.conf;
        fastcgi_pass unix:/run/php/php8.5-fpm.sock;
        fastcgi_connect_timeout 60s;
        fastcgi_send_timeout 300s;
        fastcgi_read_timeout 300s;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        include fastcgi_params;
    }

    location ~ /\.ht {
        deny all;
    }
}

server {
    listen 80;
    listen [::]:80;
    server_name novustream-starita.novulutions.com;

    return 301 https://novustream-starita.novulutions.com$request_uri;
}
