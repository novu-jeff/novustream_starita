# Starita NovuStream staging - port 8002
# Install: sudo cp nginx-staging.conf /etc/nginx/sites-available/starita-staging && sudo ln -sf /etc/nginx/sites-available/starita-staging /etc/nginx/sites-enabled/ && sudo nginx -t && sudo systemctl reload nginx
server {
    listen 8002;
    listen [::]:8002;
    server_name 38.226.41.3 _;

    root /var/www/html/starita-staging/public;
    index index.php index.html;

    client_max_body_size 50M;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        include snippets/fastcgi-php.conf;
        fastcgi_pass unix:/run/php/php8.3-fpm.sock;
        # Offline payload build can take >60s on large account sets; avoid 504.
        fastcgi_connect_timeout 60s;
        fastcgi_send_timeout 300s;
        fastcgi_read_timeout 300s;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        include fastcgi_params;
    }

    location ~ /\.ht {
        deny all;
    }
}
